name: Build ELBRO GEO SCAN APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The repository intentionally does NOT commit the binary gradle-wrapper.jar
      # (this project was generated without network/build access — see README).
      # This step installs a real Gradle distribution and uses it to (re)generate a
      # working gradlew + gradle-wrapper.jar matching gradle/wrapper/gradle-wrapper.properties,
      # then every subsequent step calls ./gradlew exactly as a normal local build would.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Provide placeholder local.properties (MAPS_API_KEY)
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY || 'YOUR_API_KEY_HERE' }}" >> local.properties

      - name: Ensure debug keystore exists (used as temporary release signing key)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release APK exists
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: expected APK not found at $APK_PATH"
            find app/build/outputs -name "*.apk"
            exit 1
          fi
          echo "APK found:"
          ls -la "$APK_PATH"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELBRO-GEO-SCAN-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELBRO-GEO-SCAN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
